  var DEFAULT_ICON = ICON_DARK;
  var MAX_TURNS_SENT = 4;

  // log hanya hidup di memori. gen dinaikkan tiap sesi ditutup, supaya
  // jawaban yang telat datang tidak "menghidupkan" chat yang sudah ditutup.
  // qMemory: daftar pertanyaan sesi ini (RAM saja, ikut terhapus saat chat ditutup).
  // Maksimal 12 pertanyaan x 80 karakter; server memotongnya lagi.
  var state = { log: [], topic: "", qMemory: [], busy: false, gen: 0, animIdx: -1, animTimer: null, waitTimer: null };
  var TYPE_TOTAL_MS = 1400;      // durasi ketik total (jawaban panjang tetap cepat)
  var TYPE_MIN_MS = 450;

  /* ── Ikon kustom ─────────────────────────────────────────────── */
  function getIcon() {
    try { return (localStorage.getItem(ICON_KEY) || "").trim() || DEFAULT_ICON; }
    catch (e) { return DEFAULT_ICON; }
  }

  function isImage(v) {
    return /^(https?:\/\/|data:image\/|\.?\/)/i.test(v) && /\.(png|jpe?g|webp|svg|gif)(\?|$)/i.test(v)
      || /^data:image\//i.test(v);
  }

  function hasCustomIcon() {
    try { return !!(localStorage.getItem(ICON_KEY) || "").trim(); } catch (e) { return false; }
  }

  // Ikon bawaan punya 2 varian karena latarnya beda:
  // tombol top-bar di atas hijau tua → glyph putih; header dialog di atas terang → glyph gelap.
  function renderIcon() {
    var custom = hasCustomIcon();
    var vBtn = custom ? getIcon() : ICON_LIGHT;
    var vHdr = custom ? getIcon() : ICON_DARK;
    var el = document.getElementById("askAiBtnIcon");
    if (el) {
      el.textContent = "";
      el.style.background = "";
      el.style.color = "";
      if (isImage(vBtn)) {
        el.style.width = "28px";
        el.style.height = "28px";
        el.style.borderRadius = "0";
        el.style.background = "url('" + vBtn.replace(/'/g, "%27") + "') center/contain no-repeat";
      } else {
        el.style.width = "auto";
        el.style.height = "auto";
        el.style.fontSize = "18px";
        el.textContent = Array.from(vBtn).slice(0, 3).join("");
      }
    }
    var hdr = document.getElementById("askAiHeadIcon");
    if (hdr) {
      hdr.textContent = isImage(vHdr) ? "" : vHdr;
      hdr.style.background = isImage(vHdr) ? "url('" + vHdr.replace(/'/g, "%27") + "') center/contain no-repeat" : "";
      if (isImage(vHdr)) { hdr.style.backgroundSize = "contain"; hdr.style.backgroundRepeat = "no-repeat"; }
    }
  }

  function setIcon(v) {
    try { localStorage.setItem(ICON_KEY, String(v || "").trim()); } catch (e) {}
    renderIcon();
  }

  function sentTurns() {
    // Kirim maksimal 2 giliran terakhir saja (hemat token, konteks tetap nyambung)
    var turns = [];
    var msgs = state.log.filter(function (m) { return m.role === "user" || m.role === "model"; });
    var recent = msgs.slice(-MAX_TURNS_SENT * 2);
    recent.forEach(function (m) {
      turns.push({ role: m.role, text: String(m.text || "").slice(0, 400) });
    });
    return turns;
  }


  /* ── Memori pertanyaan sesi (RAM saja) ───────────────────────────
     Yang dikirim hanya PERTANYAAN, bukan jawaban Mirim: jawaban lama tidak
     boleh dianggap fakta. Batas 12 x 80 karakter di sini dan di server. */
  var QMEM_MAX = 12;
  var QMEM_CHARS = 80;

  function sanitizeMemoryItem(s) {
    return String(s == null ? "" : s)
      .replace(/[\u0000-\u001f\u007f-\u009f\u2028\u2029]+/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, QMEM_CHARS);
  }

  function pushQuestionMemory(mem, q) {
    var list = Array.isArray(mem) ? mem.slice(0) : [];
    var s = sanitizeMemoryItem(q);
    if (s) list.push(s);
    return list.slice(-QMEM_MAX);
  }

  function buildAskPayload(q, hist, mem, topic) {
    var list = (Array.isArray(mem) ? mem : []).slice(-QMEM_MAX)
      .map(sanitizeMemoryItem)
      .filter(function (s) { return !!s; });
    return {
      action: "askAI",
      q: String(q || "").slice(0, 300),
      topic: String(topic || "").slice(0, 120),
      history: Array.isArray(hist) ? hist.slice(-8) : [],
      questionMemory: list
    };
  }

  /* ── UI ──────────────────────────────────────────────────────── */
  var CSS = [
    "#askAiDialog .dialog-sheet{max-height:86vh;display:flex;flex-direction:column;gap:10px;padding-bottom:18px;}",
    "#askAiHead{display:flex;align-items:center;gap:10px;}",
    "#askAiHeadIcon{width:40px;height:40px;border-radius:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:transparent;background-size:contain;background-repeat:no-repeat;background-position:center;}",
    "#askAiTitle{font-weight:800;font-size:1rem;}",
    "#askAiSub{font-size:.7rem;color:var(--on-surface-variant,#64748b);}",
    "#askAiClose{margin-left:auto;background:none;border:0;font-size:1.2rem;color:var(--on-surface-variant,#64748b);cursor:pointer;padding:4px 8px;}",
    "#askAiThread{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:160px;max-height:52vh;padding:4px 2px;}",
    ".askai-msg{max-width:86%;padding:9px 12px;border-radius:14px;font-size:.84rem;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;}",
    ".askai-msg.user{align-self:flex-end;background:var(--primary,#1e293b);color:#fff;border-bottom-right-radius:4px;}",
    ".askai-msg.model{align-self:flex-start;background:var(--surface-variant,#eef2f6);color:var(--on-surface,#0f172a);border-bottom-left-radius:4px;}",
    ".askai-msg.sys{align-self:center;background:#fef3c7;color:#92400e;font-size:.75rem;text-align:center;}",
    "#askAiInputRow{display:flex;gap:8px;align-items:flex-end;}",
    "#askAiInput{flex:1;resize:none;max-height:90px;padding:10px 12px;border-radius:12px;border:1px solid var(--outline-variant,#cbd5e1);font-size:.85rem;font-family:inherit;background:var(--surface,#fff);color:inherit;}",
    "#askAiSend{width:42px;height:42px;border-radius:50%;border:0;background:var(--primary,#1e293b);color:#fff;font-size:1rem;cursor:pointer;}",
    "#askAiSend:disabled{opacity:.45;}",
    ".askai-note{font-size:.66rem;color:var(--on-surface-variant,#94a3b8);text-align:center;}",
    ".askai-dots span{display:inline-block;width:5px;height:5px;margin-right:3px;border-radius:50%;background:currentColor;opacity:.35;animation:askaiDot 1s infinite;}",
    ".askai-dots span:nth-child(2){animation-delay:.15s;}",
    ".askai-dots span:nth-child(3){animation-delay:.3s;}",
    ".askai-wait{display:flex;align-items:center;gap:8px;color:var(--on-surface-variant,#64748b);font-size:.8rem;}",
    ".askai-wait .askai-dots{font-size:0;}",
    ".askai-msg.model.askai-typing::after{content:'▍';margin-left:2px;opacity:.55;animation:askaiCaret .9s steps(1) infinite;}",
    "@keyframes askaiCaret{0%,49%{opacity:.55;}50%,100%{opacity:0;}}",
    "@keyframes askaiDot{0%,100%{opacity:.25;transform:translateY(0);}50%{opacity:.9;transform:translateY(-2px);}}"
  ].join("");

  var SHEET_HTML = ''
    + '<div class="dialog-overlay" id="askAiDialog" role="dialog" aria-modal="true">'
    + '  <div class="dialog-sheet">'
    + '    <div class="dialog-handle"></div>'
    + '    <div id="askAiHead">'
    + '      <div id="askAiHeadIcon">💬</div>'
    + '      <div>'
    + '        <div id="askAiTitle">Tanya Mirim</div>'
    + '        <div id="askAiSub">AI Assistant Rimba Alam</div>'
    + '      </div>'
    + '      <button id="askAiClose" aria-label="Tutup">✕</button>'
    + '    </div>'
    + '    <div id="askAiThread"></div>'
    + '    <div id="askAiInputRow">'
    + '      <textarea id="askAiInput" rows="1" placeholder="Mau tanya apa hari ini?"></textarea>'
    + '      <button id="askAiSend" aria-label="Kirim">➤</button>'
    + '    </div>'
    + '    <div class="askai-note">Khusus data stok Rimba Alam · bisa cek bulan mana pun</div>'
    + '  </div>'
    + '</div>';

  function ensureUI() {
    if (document.getElementById("askAiDialog")) return;
    var style = document.createElement("style");
    style.textContent = CSS;
    document.head.appendChild(style);

    var holder = document.createElement("div");
    holder.innerHTML = SHEET_HTML;
    document.body.appendChild(holder.firstElementChild);

    document.getElementById("askAiThread").addEventListener("click", function () {
      finishAnimNow();
    });
    document.getElementById("askAiClose").addEventListener("click", close);
    document.getElementById("askAiDialog").addEventListener("click", function (e) {
      if (e.target && e.target.id === "askAiDialog") close();
    });
    document.getElementById("askAiSend").addEventListener("click", submit);
    var ta = document.getElementById("askAiInput");
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
    });
    ta.addEventListener("input", function () {
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 90) + "px";
    });
    renderIcon();
  }

  /* Tombol 💬 dipasang sendiri oleh modul ini, jadi index.html tidak perlu
     diubah lagi tiap kali aplikasi kamu update. */
  function injectButton() {
    if (!canUseMirim()) return false;
    if (document.getElementById("btnAskAi")) return true;
    var anchor = document.querySelector('.top-bar [title="Pengaturan PIN Karyawan"]');
    var host = anchor ? anchor.parentNode : document.querySelector(".top-bar");
    if (!host) return false;

    var btn = document.createElement("button");
    btn.className = "top-bar-action";
    btn.id = "btnAskAi";
    btn.title = "Tanya Mirim";
    btn.innerHTML = '<span id="askAiBtnIcon" style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;"></span>';
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      open();
    });

    if (anchor && anchor.parentNode === host) host.insertBefore(btn, anchor);
    else host.appendChild(btn);
    renderIcon();
    return true;
  }

  var WAIT_STEPS = [
    "Mirim cek data stok dulu ya \ud83d\udd0d",
    "Lagi baca catatan inputnya \ud83d\udcdd",
    "Sebentar, nyusun jawabannya \u2728"
  ];

  function bubble(role, text) {
    ensureUI();
    var thread = document.getElementById("askAiThread");
    var d = document.createElement("div");
    d.className = "askai-msg " + role;
    if (role === "typing") {
      d.className = "askai-msg model";
      d.id = "askAiTyping";
      d.innerHTML = '<span class="askai-wait">' +
        '<span class="askai-dots"><span></span><span></span><span></span></span>' +
        '<span id="askAiWaitText">' + WAIT_STEPS[0] + '</span></span>';
      startWaitNudge();
    } else {
      d.textContent = text;
    }
    thread.appendChild(d);
    thread.scrollTop = thread.scrollHeight;
    return d;
  }

  // Teks status berganti tiap ~1 detik: bikin terasa responsif, bukan diam.
  function startWaitNudge() {
    stopWaitNudge();
    var i = 1;
    state.waitTimer = setInterval(function () {
      var el = document.getElementById("askAiWaitText");
      if (!el) { stopWaitNudge(); return; }
      el.textContent = WAIT_STEPS[i % WAIT_STEPS.length];
      i++;
    }, 1100);
  }

  function stopWaitNudge() {
    if (state.waitTimer) { clearInterval(state.waitTimer); state.waitTimer = null; }
  }

  // Efek ketik: teks muncul bertahap. Tap/klik bubble = langsung tampil semua.
  function stopAnim() {
    if (state.animTimer) { clearTimeout(state.animTimer); state.animTimer = null; }
  }

  function typeMessage(el, full) {
    stopAnim();
    var n = full.length;
    if (!n) { el.textContent = ""; return; }
    var duration = Math.max(TYPE_MIN_MS, Math.min(TYPE_TOTAL_MS, n * 14));
    var perTick = Math.max(1, Math.ceil(n / (duration / 30)));   // ~30ms/tick
    var i = 0;
    el.textContent = "";
    el.classList.add("askai-typing");
    el.setAttribute("data-full", full);
    el.__full = full;

    function tick() {
      var live = document.getElementById("askAiThread");
      if (!live || !live.contains(el)) { stopAnim(); return; }
      i += perTick;
      if (i >= n) {
        el.textContent = full;
        el.classList.remove("askai-typing");
        el.removeAttribute("data-full");
        el.__full = "";
        stopAnim();
        var th = document.getElementById("askAiThread");
        if (th) th.scrollTop = th.scrollHeight;
        return;
      }
      el.textContent = full.slice(0, i);
      var th2 = document.getElementById("askAiThread");
      if (th2) th2.scrollTop = th2.scrollHeight;
      state.animTimer = setTimeout(tick, 30);
    }
    state.animTimer = setTimeout(tick, 120);
  }

  function finishAnimNow() {
    var el = document.querySelector(".askai-msg.model.askai-typing");
    if (!el) return false;
    stopAnim();
    if (el.__full) el.textContent = el.__full;
    el.__full = "";
    el.classList.remove("askai-typing");
    return true;
  }

  function clearTyping() {
    stopWaitNudge();
    var t = document.getElementById("askAiTyping");
    if (t && t.parentNode) t.parentNode.removeChild(t);
  }

  function renderThread() {
    ensureUI();
    var thread = document.getElementById("askAiThread");
    thread.innerHTML = "";
    if (!state.log.length) {
      var t = document.createElement("div");
      t.className = "askai-msg model";
      t.textContent = "Hallo! Mirim di sini 👋✨ Ada yang bisa dibantu?";
      thread.appendChild(t);
      return;
    }
    var lastModel = -1;
    for (var k = state.log.length - 1; k >= 0; k--) {
      if (state.log[k].role === "model") { lastModel = k; break; }
    }
    state.log.forEach(function (m, idx) {
      var d = document.createElement("div");
      d.className = "askai-msg " + (m.role === "user" ? "user" : m.role === "sys" ? "sys" : "model");
      if (idx === state.animIdx && m.role === "model") {
        d.textContent = "";
        thread.appendChild(d);
        typeMessage(d, String(m.text || ""));
      } else {
        d.textContent = m.text;
        thread.appendChild(d);
      }
    });
    state.animIdx = -1;
    thread.scrollTop = thread.scrollHeight;
  }

  /* ── Kirim pertanyaan ────────────────────────────────────────── */
  function friendlyError(data) {
    var code = (data && data.code) || "";
    if (code === "QUOTA") return data.message || "Batas pertanyaan harian sudah tercapai.";
    if (code === "QUOTA_SHARED") return data.message || "Batas bersama Mirim hari ini sudah tercapai. Coba lagi besok.";
    if (code === "THROTTLE" || code === "BUSY") return data.message || "Terlalu banyak permintaan. Coba lagi sebentar lagi.";
    if (code === "UNAUTHORIZED") return "Sesi kamu tidak valid. Logout lalu login lagi (nama + PIN).";
    if (code === "EMPTY") return "Pertanyaannya kosong.";
    if (code === "FORBIDDEN") return "Mirim khusus admin. Akun kamu belum punya akses.";
    if (code === "NOT_CONFIGURED") return "Mirim belum aktif: kunci AI belum dipasang di server.";
    if (code === "FAILED") return "Mirim lagi nggak bisa jawab. Coba lagi sebentar ya 🙏";
    return "Mirim belum bisa dihubungi. Coba lagi sebentar ya.";
  }

  function submit() {
    var ta = document.getElementById("askAiInput");
    if (!ta) return;
    var q = (ta.value || "").trim();
    if (!q || state.busy) return;
    ta.value = "";
    ta.style.height = "auto";
    ask(q);
  }

  function ask(q) {
    ensureUI();
    var gen = state.gen;              // sesi saat pertanyaan dikirim
    state.busy = true;
    // Riwayat dihitung SEBELUM pertanyaan baru masuk, supaya pertanyaan ini tidak terkirim dua kali
    var hist = sentTurns();
    var sendBtn = document.getElementById("askAiSend");
    if (sendBtn) sendBtn.disabled = true;

    state.log.push({ role: "user", text: q });
    renderThread();
    bubble("typing");

    var url = (window.DataService && typeof window.DataService.getGasUrl === "function")
      ? window.DataService.getGasUrl() : "";
    if (!url) {
      clearTyping();
      state.busy = false;
      if (sendBtn) sendBtn.disabled = false;
      bubble("sys", "URL Google Sheets belum diatur.");
      return;
    }

    // POST JSON, bukan GET: pertanyaan + riwayat + memori bisa >2 KB dan
    // parameter URL akan membengkak/terpotong. Shim fetch aplikasi menempelkan
    // token sesi ke body; tidak ada PIN/kunci di sini.
    var payload = buildAskPayload(q, hist, state.qMemory, state.topic);
    state.qMemory = pushQuestionMemory(state.qMemory, q);

    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (gen !== state.gen) return;   // chat sudah ditutup → buang jawabannya
        clearTyping();
        if (data && data.success && data.answer) {
          if (data.topic) state.topic = data.topic;
          state.animIdx = state.log.length;      // pesan ini diketik bertahap
          state.log.push({ role: "model", text: data.answer, topic: data.topic || "" });
        } else {
          state.log.push({ role: "sys", text: friendlyError(data) });
        }
        renderThread();
      })
      .catch(function (err) {
        if (gen !== state.gen) return;
        clearTyping();
        state.log.push({ role: "sys", text: "Gagal menghubungi server (" + err.message + ")." });
        renderThread();
      })
      .then(function () {
        if (gen !== state.gen) return;
        state.busy = false;
        var b = document.getElementById("askAiSend");
        if (b) b.disabled = false;
      });
  }

  /* ── Buka / tutup ────────────────────────────────────────────── */
  // Mirim khusus admin. Server juga menolak akun non-admin, ini hanya lapisan UI.
  function canUseMirim() {
    try {
      if (window.AuthService && typeof window.AuthService.isAdmin === "function") {
        return !!window.AuthService.isAdmin();
      }
      var u = (window.AuthService && window.AuthService.getCurrentUser) ? window.AuthService.getCurrentUser() : null;
      return !!(u && (u.role === "admin" || u.role === "superadmin" || u.role === "owner"));
    } catch (e) { return false; }
  }

  function open() {
    if (!canUseMirim()) {
      var me = (window.AuthService && window.AuthService.getCurrentUser) ? window.AuthService.getCurrentUser() : null;
      if (window.App && window.App.showToast) {
        window.App.showToast(me ? "Mirim khusus admin. Akun kamu belum punya akses." : "Login dulu untuk memakai Mirim.", "error");
      }
      return;
    }
    injectButton();
    ensureUI();
    reset();                      // tiap buka = percakapan baru
    renderIcon();
    var dlg = document.getElementById("askAiDialog");
    if (dlg) dlg.classList.add("show");
    setTimeout(function () {
      var ta = document.getElementById("askAiInput");
      if (ta && !("ontouchstart" in window)) ta.focus();
    }, 250);
  }

  function reset() {
    state.gen++;                 // jawaban lama yang masih di jalan jadi tidak dipakai
    stopAnim();
    stopWaitNudge();
    state.animIdx = -1;
    state.log = [];
    state.topic = "";
    state.qMemory = [];          // tutup/buka chat = memori pertanyaan ikut hilang
    state.busy = false;
    var b = document.getElementById("askAiSend");
    if (b) b.disabled = false;
    clearTyping();
    renderThread();
  }

  function close() {
    var dlg = document.getElementById("askAiDialog");
    if (dlg) dlg.classList.remove("show");
    var ta = document.getElementById("askAiInput");
    if (ta) { ta.value = ""; ta.style.height = "auto"; }   // sisa teks yang belum terkirim ikut dibuang
    reset();                      // tutup = percakapan dihapus
  }

  /* ── Pasang ke App + saat halaman siap ───────────────────────── */
  function syncButton() {
    var btn = document.getElementById("btnAskAi");
    if (!canUseMirim()) {
      if (btn && btn.parentNode) btn.parentNode.removeChild(btn);
      return;
    }
    if (!btn) injectButton();
  }

  function boot() {
    ensureUI();
    syncButton();
    renderIcon();
    setInterval(syncButton, 1500);   // ikut berubah saat login/logout atau ganti akun
    if (window.App) {
      window.App.openAskAi = open;
      window.App.closeAskAi = close;
      window.App.setAskAiIcon = setIcon;
      window.App.getAskAiIcon = getIcon;
      window.App.resetAskAi = reset;
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
